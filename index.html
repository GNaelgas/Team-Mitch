<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Team Mitch · Staff only</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@300;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F5F7; --card:#FFFFFF; --ink:#1E293B; --navy:#0F172A;
  --primary:#2563EB; --primary-700:#1D4ED8; --primary-tint:#EFF4FE; --primary-tint-2:#D3E0FB;
  --accent:#0D9488; --accent-700:#0F766E; --accent-tint:#E6F6F4; --accent-tint-2:#BFE6E1;
  --steel:#64748B; --line:#E2E8F0; --line-strong:#CBD5E1; --muted:#475569;
  --stop:#B42318; --stop-tint:#FDF1F0;
  --radius-lg:14px; --radius:9px; --radius-sm:6px;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px); -webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;line-height:1.55;font-feature-settings:"tnum" 1}
img{max-width:100%}
a{color:var(--primary)}
:focus-visible{outline:3px solid #93B4F5;outline-offset:2px;border-radius:4px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Banner ---------- */
.banner{background:var(--navy);color:#fff;position:sticky;top:0;z-index:40;box-shadow:0 1px 0 rgba(15,23,42,.25)}
.banner-inner{max-width:1180px;margin:0 auto;padding:16px 24px 0;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:14px;color:#fff;text-decoration:none;min-width:0}
.brand img{height:46px;width:auto;border-radius:8px;box-shadow:0 0 0 2px rgba(255,255,255,.85);flex:none;background:#fff}
.brand h1{margin:0;font-size:24px;line-height:1.1;font-weight:800;letter-spacing:-.01em}
.brand p{margin:3px 0 0;font-size:13px;color:#94A3B8;font-weight:500}
.tabs{max-width:1180px;margin:0 auto;padding:14px 24px 0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;color:#CBD5E1;text-decoration:none;font-weight:600;font-size:14px;padding:10px 16px 11px;border-radius:10px 10px 0 0;white-space:nowrap;transition:background .15s,color .15s}
.tabs a:hover{background:rgba(255,255,255,.09);color:#fff}
.tabs a[aria-current="page"]{background:var(--bg);color:var(--navy)}

/* ---------- Layout ---------- */
main{max-width:1180px;margin:0 auto;padding:28px 24px 40px}
.page{display:none}
.page.active{display:block}
.page-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,400px);gap:20px 32px;align-items:end;margin-bottom:26px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.page-head h2{margin:0;font-size:30px;line-height:1.15;font-weight:800;letter-spacing:-.015em}
.page-head p{margin:6px 0 0;color:var(--muted);max-width:62ch}
h3.section-title{font-size:18px;margin:34px 0 12px;font-weight:700;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h3.section-title small{font-size:13px;color:var(--steel);font-weight:500}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}

/* ---------- Panels ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden}
.panel-head{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.panel-head h4{margin:0;font-size:15.5px;font-weight:700}
.panel-head .ic{color:var(--primary)}
.panel-body{padding:16px 20px}
.panel-body > :first-child{margin-top:0}
.panel-body > :last-child{margin-bottom:0}
.panel-foot{padding:11px 20px;border-top:1px solid var(--line);font-size:13px;color:var(--steel);background:#F8F9FA}
.panel.lead{border-color:var(--line-strong)}
.panel.lead .panel-head{background:var(--navy);color:#fff;border-bottom:0}
.panel.lead .panel-head .ic{color:#5EEAD4}

.note{background:var(--primary-tint);border-radius:var(--radius);padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.note .ic{color:var(--primary);margin-top:2px;flex:none}
.stop{background:var(--stop-tint);color:#7A1A12;border-radius:var(--radius);padding:12px 14px;display:flex;gap:10px;align-items:flex-start;border-left:3px solid var(--stop)}
.stop .ic{color:var(--stop);margin-top:2px;flex:none}
.stop-inline{display:inline-block;background:var(--stop-tint);color:var(--stop);font-weight:700;font-size:12.5px;padding:3px 8px;border-radius:5px;margin-top:6px}
.who{font-size:13px;color:var(--steel)}

/* ---------- Tables ---------- */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:560px}
th{text-align:left;font-size:12.5px;font-weight:700;color:var(--steel);padding:11px 20px;border-bottom:1px solid var(--line);background:#F8F9FA}
td{padding:11px 20px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.k{font-weight:600}
td.none{color:#A0AEC0}
.kv td:first-child{width:38%;font-weight:600;color:var(--ink)}

/* ---------- Copy chips ---------- */
.chip{appearance:none;border:1px solid var(--primary-tint-2);background:var(--primary-tint);color:var(--primary-700);font:inherit;font-size:14px;font-weight:600;padding:5px 10px 5px 8px;border-radius:7px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;transition:background .12s,border-color .12s;font-variant-numeric:tabular-nums;max-width:100%}
.chip .ic{width:14px;height:14px;opacity:.7;flex:none}
.chip:hover{background:var(--primary-tint-2);border-color:#A9C2F7}
.chip.done{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.done .ic{opacity:1}
.chip.email{white-space:normal;word-break:break-all;text-align:left}
.chip.lg{font-size:16px;padding:8px 13px 8px 11px}

.btn{appearance:none;border:1px solid var(--accent);background:var(--accent);color:#fff;font:inherit;font-weight:600;font-size:13.5px;padding:7px 13px;border-radius:7px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--accent-700);border-color:var(--accent-700)}
.btn.ghost{background:#fff;color:var(--accent-700);border-color:var(--accent-tint-2)}
.btn.ghost:hover{background:var(--accent-tint)}
.btn .ic{width:15px;height:15px}
.btn.done{background:var(--navy);border-color:var(--navy);color:#fff}

.line-copy{display:flex;align-items:center;gap:12px;background:#F8F9FA;border:1px solid var(--line);border-radius:var(--radius);padding:10px 10px 10px 14px}
.line-copy code{flex:1;min-width:0;font-family:inherit;font-weight:600;font-size:14px;color:var(--ink);word-break:break-word}
.line-copy .lbl{font-size:12.5px;color:var(--steel);font-weight:600;flex:none}

/* ---------- Steps (real sequence) ---------- */
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{counter-increment:s;position:relative;padding:0 0 18px 44px}
.steps li::before{content:counter(s);position:absolute;left:0;top:-1px;width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;font-weight:700;font-size:13.5px;display:grid;place-items:center}
.steps li:not(:last-child)::after{content:"";position:absolute;left:13.5px;top:30px;bottom:2px;width:1px;background:var(--line-strong)}
.steps strong{display:block;font-size:15px}
.steps p{margin:2px 0 0;color:var(--muted);font-size:14px}
.steps .line-copy{margin-top:10px}
.bullets{margin:8px 0 0;padding-left:20px}
.bullets li{margin:3px 0}

/* ---------- Templates ---------- */
.tpl-layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;align-items:start}
.toc{position:sticky;top:150px;font-size:14px}
.toc h5{margin:0 0 6px;font-size:13px;color:var(--steel);font-weight:700}
.toc ul{list-style:none;margin:0 0 18px;padding:0;border-left:2px solid var(--line)}
.toc a{display:block;padding:4px 0 4px 12px;margin-left:-2px;border-left:2px solid transparent;color:var(--muted);text-decoration:none;line-height:1.35}
.toc a:hover{color:var(--primary);border-left-color:var(--primary)}
.tpl-group + .tpl-group{margin-top:34px}
.tpl-group > h3{font-size:18px;margin:0 0 4px}
.tpl-group > p{margin:0 0 14px;color:var(--muted);font-size:14px}
details.tpl{background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);margin-bottom:10px}
details.tpl[open]{border-color:var(--line-strong)}
details.tpl > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:14px;padding:14px 16px 14px 18px}
details.tpl > summary::-webkit-details-marker{display:none}
.tpl-title{flex:1;min-width:0}
.tpl-title strong{display:block;font-size:15px}
.tpl-title span{display:block;font-size:13px;color:var(--steel)}
.chev{width:18px;height:18px;color:var(--steel);transition:transform .18s;flex:none}
details[open] .chev{transform:rotate(180deg)}
.tag{font-size:12px;font-weight:600;padding:2px 8px;border-radius:20px;background:#F4F5F7;color:var(--muted);border:1px solid var(--line);flex:none}
.tag.internal{background:var(--primary-tint);color:var(--primary-700);border-color:var(--primary-tint-2)}
.tpl-body{padding:0 18px 18px;display:grid;gap:12px}
.tpl-meta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:13.5px}
.tpl-meta .lbl{color:var(--steel);font-weight:600}
pre.text{margin:0;white-space:pre-wrap;word-wrap:break-word;font-family:inherit;font-size:14.5px;line-height:1.6;background:#F8F9FA;border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;color:var(--ink);max-width:80ch}
.ph{background:#FFF6D6;color:#5C4400;border-radius:3px;padding:0 2px}
.body-bar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.body-bar span{font-size:13px;color:var(--steel);font-weight:600}

/* ---------- Home ---------- */
.welcome{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;align-items:stretch;margin-bottom:30px}
.welcome-copy h2{font-size:40px;line-height:1.05;margin:4px 0 12px;font-weight:800;letter-spacing:-.025em}
.welcome-copy p{color:var(--muted);font-size:16px;max-width:54ch;margin:0 0 20px}
.welcome-copy .search{max-width:520px}
.dial{background:var(--navy);color:#fff;border-radius:var(--radius-lg);padding:20px 22px}
.dial h3{margin:0 0 4px;font-size:16px}
.dial p{margin:0 0 14px;color:#94A3B8;font-size:13.5px}
.dial-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-top:1px solid rgba(255,255,255,.14)}
.dial-row span{font-weight:600;font-size:14px}
.dial .chip{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.22);color:#fff}
.dial .chip:hover{background:rgba(255,255,255,.18)}
.dial .chip.done{background:var(--accent);border-color:var(--accent);color:#fff}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
a.card{display:block;text-decoration:none;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);padding:18px 18px 16px;transition:border-color .15s,background .15s}
a.card:hover{border-color:var(--accent);background:#FFFFFF}
a.card .ic{color:var(--accent);width:22px;height:22px}
a.card h4{margin:10px 0 4px;font-size:16px}
a.card p{margin:0;color:var(--muted);font-size:13.5px}
a.card .count{display:block;margin-top:12px;font-size:12.5px;color:var(--steel);font-weight:600}
.alert-strip{display:grid;gap:10px;margin-top:6px}

/* ---------- Files ---------- */
.file-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
a.file{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;text-decoration:none;color:var(--ink);transition:border-color .15s,background .15s}
a.file:hover{border-color:var(--accent);background:#FFFFFF}
.ext{width:44px;height:50px;border-radius:6px 14px 6px 6px;background:var(--accent-tint);color:var(--accent-700);font-weight:800;font-size:11.5px;display:grid;place-items:end center;padding-bottom:7px;border:1px solid var(--accent-tint-2)}
.ext.exe,.ext.msi{background:#F4F5F7;color:var(--muted);border-color:var(--line-strong)}
.f-text strong{display:block;font-size:14.5px;line-height:1.3}
.f-text span{display:block;font-size:13px;color:var(--steel)}
a.file .ic{color:var(--accent);width:20px;height:20px}

/* ---------- Search ---------- */
.search{position:relative;width:100%}
.search input{width:100%;font:inherit;font-size:15px;padding:11px 44px 11px 40px;border:1.5px solid var(--accent-tint-2);border-radius:10px;background:#fff;color:var(--ink)}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(13,148,136,.18)}
.search > .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--accent);width:17px;height:17px;pointer-events:none}
.search kbd{position:absolute;right:11px;top:50%;transform:translateY(-50%);font:inherit;font-size:12px;color:var(--steel);border:1px solid var(--line-strong);border-radius:5px;padding:0 6px;background:#F8FAFC}
.results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line-strong);border-radius:12px;box-shadow:0 14px 34px -12px rgba(15,23,42,.28);list-style:none;margin:0;padding:6px;z-index:30;max-height:min(440px,60vh);overflow-y:auto;display:none}
.results.open{display:block}
.results li a{display:block;padding:9px 11px;border-radius:8px;text-decoration:none;color:var(--ink)}
.results li a:hover,.results li a.sel{background:var(--accent-tint)}
.results .r-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.results .r-title{font-weight:700;font-size:14px}
.results .r-page{font-size:12px;color:var(--steel);flex:none}
.results .r-snip{font-size:13px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.results mark{background:#FFE58A;color:inherit;border-radius:2px;padding:0 1px}
.results .empty{padding:12px;color:var(--muted);font-size:14px}
.flash{animation:flash 1.8s ease-out}
@keyframes flash{0%,30%{box-shadow:0 0 0 4px rgba(37,99,235,.35)}100%{box-shadow:0 0 0 4px rgba(37,99,235,0)}}

/* ---------- Toast / footer ---------- */
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:9px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:60;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
footer{border-top:1px solid var(--line);color:var(--steel);font-size:13.5px}
footer div{max-width:1180px;margin:0 auto;padding:20px 24px 28px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ic{width:18px;height:18px;flex:none}
h1,h2,h3,h4,h5,.tpl-title strong,.r-title{font-family:"Space Grotesk","Inter",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
.page-head h2,.welcome-copy h2,.brand h1{font-weight:700;letter-spacing:-.01em}
h3.section-title,.tpl-group > h3,.dial h3{font-weight:700}
.panel-head h4,a.card h4,.toc h5{font-weight:700}
.tpl-title strong,.r-title{font-weight:700;font-size:14px}
.page-head p,.welcome-copy p{font-weight:400}
.guard-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,1fr);gap:14px 20px;align-items:start}
@media (max-width:900px){.guard-grid{grid-template-columns:1fr}}

@media (max-width:900px){
  .page-head,.welcome,.tpl-layout{grid-template-columns:1fr}
  .toc{position:static}
  .grid-2,.grid-3{grid-template-columns:1fr}
  .welcome-copy h2{font-size:32px}
}
@media (max-width:560px){
  .banner-inner{padding:12px 16px 0}
  .brand img{height:38px}
  .brand h1{font-size:20px}
  .brand p{font-size:12px}
  .tabs{padding:10px 16px 0}
  main{padding:22px 16px 32px}
  .page-head h2{font-size:25px}
  th,td{padding:10px 14px}
  .file-list{grid-template-columns:1fr}
  .line-copy{flex-wrap:wrap}
  .search kbd{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<style>
body.locked{min-height:100vh}
.gate{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg)}
.gate-bar{background:var(--navy);color:#fff}
.gate-bar-inner{max-width:1180px;margin:0 auto;padding:16px 24px;display:flex;align-items:center;gap:14px}
.gate-bar img{height:46px;width:auto;border-radius:8px;box-shadow:0 0 0 2px rgba(255,255,255,.85);background:#fff;flex:none}
.gate-t{margin:0;font-family:"Space Grotesk","Inter",system-ui,sans-serif;font-weight:700;font-size:22px;line-height:1.15}
.gate-s{margin:3px 0 0;font-size:13px;color:#94A3B8}
.gate-main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px}
.gate-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:32px 30px 24px;width:100%;max-width:380px;text-align:center}
.gate-ic{width:52px;height:52px;border-radius:50%;background:var(--accent-tint);color:var(--accent-700);display:inline-grid;place-items:center}
.gate-ic svg{width:24px;height:24px}
.gate-card.is-locked .gate-ic{background:var(--stop-tint);color:var(--stop)}
.gate-h{margin:14px 0 6px;font-family:"Space Grotesk","Inter",system-ui,sans-serif;font-weight:700;font-size:24px;color:var(--ink)}
.gate-p{margin:0 0 20px;color:var(--muted);font-size:14.5px;line-height:1.5}
.gate-code{width:100%;text-align:center;font:inherit;font-size:30px;letter-spacing:.6em;padding:12px 0 12px .6em;border:1.5px solid var(--accent-tint-2);border-radius:12px;background:#fff;color:var(--ink)}
.gate-code::placeholder{font-size:15px;letter-spacing:.15em;color:#94A3B8}
.gate-code:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(13,148,136,.18)}
.gate-code:disabled{background:var(--bg);border-color:var(--line)}
.gate-go{margin-top:12px;width:100%;font:inherit;font-weight:600;font-size:15px;padding:11px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
.gate-go:hover{background:var(--accent-700);border-color:var(--accent-700)}
.gate-go:disabled{background:#CBD5E1;border-color:#CBD5E1;cursor:not-allowed}
.gate-clock{margin:2px 0 16px}
.gate-clock span{display:block;font-size:13px;color:var(--muted)}
.gate-clock strong{display:block;font-family:"Space Grotesk","Inter",system-ui,sans-serif;font-size:34px;color:var(--stop);font-variant-numeric:tabular-nums;line-height:1.2}
.gate-msg{min-height:20px;margin-top:10px;font-size:13.5px;color:var(--stop);line-height:1.45}
.gate-msg.warn{display:flex;gap:9px;align-items:flex-start;text-align:left;background:var(--stop-tint);color:#7A1A12;border-left:3px solid var(--stop);border-radius:0;padding:10px 12px}
.gate-msg.warn svg{width:18px;height:18px;flex:none;color:var(--stop);margin-top:1px}
.gate-msg:empty{margin-top:0;min-height:0}
.gate-ok{color:var(--accent-700);font-weight:600;font-size:14.5px;margin:0}
.gate-note{margin:16px 0 0;font-size:12.5px;color:var(--steel)}
.gate-foot{text-align:center;font-size:13px;color:var(--steel);padding:0 16px 24px}
.signout{margin-left:auto;flex:none;appearance:none;background:transparent;border:1px solid rgba(255,255,255,.3);color:#E2E8F0;font:inherit;font-size:13px;font-weight:600;padding:6px 12px;border-radius:8px;cursor:pointer}
.signout:hover{background:rgba(255,255,255,.1);color:#fff}

/* ---------- About Our Client ---------- */
.ac-head{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px;align-items:start}
.ac-head h3{font-size:28px;margin:0 0 8px;line-height:1.1}
.ac-head p{margin:0;color:var(--muted)}
.ac-tag{display:inline-block;font-size:12.5px;font-weight:600;color:var(--accent-700);background:var(--accent-tint);border-radius:20px;padding:3px 11px}
.ac-client-logo{display:block;width:170px;max-width:100%;height:auto;margin:14px 0;border-radius:10px}
.ac-facts{background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);padding:14px 18px;display:grid;gap:9px;font-size:14px}
.ac-facts div{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding-bottom:9px}
.ac-facts div:last-child{border:0;padding:0}
.ac-facts span{color:var(--steel)}
.ac-facts b{text-align:right;font-weight:600}
.ac-vh{background:var(--navy);color:#fff;border-radius:var(--radius-lg);padding:22px}
.ac-vh-top{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.4fr);gap:22px;align-items:start}
.ac-vh p{margin:0;color:#CBD5E1;font-size:14.5px}
.ac-vh p + p{margin-top:9px}
.ac-vh-id{display:flex;align-items:center;gap:13px;margin-bottom:12px}
.ac-vh-id img{width:56px;height:56px;border-radius:12px;background:#fff;flex:none}
.ac-vh .ac-vh-name{font-family:"Space Grotesk","Inter",system-ui,sans-serif;font-weight:700;font-size:20px;color:#fff;margin:0}
.ac-vh-id small{display:block;color:#94A3B8;font-size:12.5px}
.ac-grow{display:grid;grid-template-columns:minmax(0,1fr) 30px minmax(0,1fr);gap:6px}
.ac-step{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:14px}
.ac-step .d{font-family:"Space Grotesk","Inter",sans-serif;font-weight:700;color:#5EEAD4;font-size:13px}
.ac-step .n{font-family:"Space Grotesk","Inter",sans-serif;font-weight:700;color:#fff;font-size:26px;line-height:1.15;margin:4px 0 2px}
.ac-step b{display:block;color:#fff;font-size:14px}
.ac-step span{display:block;color:#94A3B8;font-size:13px;margin-top:2px}
.ac-dots{display:flex;gap:4px;margin:7px 0 4px}
.ac-dots i{width:10px;height:10px;border-radius:50%;background:#5EEAD4;display:block}
.ac-dots i.dim{opacity:.45}
.ac-arrow{display:flex;align-items:center;justify-content:center;color:#5EEAD4}
.ac-arrow .ic{width:20px;height:20px}
.ac-band{margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,255,255,.14)}
.ac-vh .ac-l{font-size:12.5px;font-weight:700;color:#94A3B8;margin-bottom:10px}
.ac-org{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap}
.ac-person{flex:1 1 210px;display:flex;gap:12px;align-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:12px 14px}
.ac-person.top{border-color:rgba(94,234,212,.5);background:rgba(94,234,212,.08)}
.ac-av{width:42px;height:42px;border-radius:50%;background:#1E293B;border:1.5px solid #5EEAD4;color:#5EEAD4;font-family:"Space Grotesk","Inter",sans-serif;font-weight:700;font-size:14.5px;display:flex;align-items:center;justify-content:center;flex:none}
.ac-person b{display:block;color:#fff;font-size:14.5px}
.ac-person .role{display:block;color:#CBD5E1;font-size:13px}
.ac-creds{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}
.ac-creds span{font-size:11.5px;font-weight:700;color:var(--navy);background:#5EEAD4;border-radius:4px;padding:1px 7px}
.ac-creds span.since{background:transparent;color:#5EEAD4;border:1px solid rgba(94,234,212,.5);font-weight:600}
.ac-tags{display:flex;flex-wrap:wrap;gap:7px}
.ac-tags span{font-size:13px;color:#E2E8F0;background:rgba(94,234,212,.1);border:1px solid rgba(94,234,212,.3);border-radius:20px;padding:4px 11px}
.ac-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:0 0 10px}
.ac-legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.ac-tl{background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);padding:6px 20px;overflow:hidden}
.ac-row{display:grid;grid-template-columns:130px 16px minmax(0,1fr);gap:12px;padding:11px 0;border-bottom:1px solid var(--line);align-items:start}
.ac-row:last-child{border-bottom:0}
.ac-date{font-family:"Space Grotesk","Inter",sans-serif;font-weight:700;font-size:14.5px;color:var(--muted)}
.ac-dot{width:11px;height:11px;border-radius:50%;background:var(--line-strong);margin-top:5px;display:inline-block;flex:none}
.ac-row.bell .ac-dot{background:#2563EB}.ac-row.bell .ac-date{color:#1D4ED8}
.ac-row.fluent .ac-dot{background:#D97706}.ac-row.fluent .ac-date{color:#B45309}
.ac-row.vh{background:#F3FBFA;margin:0 -20px;padding:11px 20px}
.ac-row.vh .ac-dot{background:var(--accent)}.ac-row.vh .ac-date{color:var(--accent-700)}
.ac-txt{font-size:14.5px}
.ac-txt span{display:block;font-size:13.5px;color:var(--steel)}
.ac-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden}
.ac-card-hd{padding:13px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.ac-card-hd .ac-dot{margin:0}
.ac-card-hd h4{margin:0;font-size:16px}
.ac-card dl{margin:0;padding:16px 18px;display:grid;gap:11px}
.ac-card dt{font-size:12.5px;font-weight:700;color:var(--steel)}
.ac-card dd{margin:2px 0 0;font-size:14.5px}
.ac-flags{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.ac-flags span{font-size:12.5px;font-weight:600;background:#FEF6E7;color:#92400E;border:1px solid #F6D9A8;border-radius:20px;padding:1px 10px}
.ac-src{font-size:12.5px;color:var(--steel);margin-top:16px}
/* ---------- Feedback ---------- */
.fb-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);padding:24px;max-width:680px}
.fb-note{display:flex;gap:12px;align-items:flex-start;background:var(--accent-tint);border-radius:var(--radius);padding:13px 15px;margin-bottom:18px}
.fb-note .ic{color:var(--accent-700);width:20px;height:20px;margin-top:2px}
.fb-note b{display:block;color:var(--accent-700);font-size:14.5px;margin-bottom:2px}
.fb-note span{font-size:14px;color:var(--ink)}
.fb-label{display:block;font-weight:600;font-size:14.5px;margin-bottom:7px;color:var(--accent-700)}
.fb-area{width:100%;min-height:160px;resize:vertical;font:inherit;font-size:15px;padding:13px 15px;border:2px solid var(--accent);border-radius:10px;background:#F3FBFA;color:var(--ink);line-height:1.5}
.fb-area::placeholder{color:#5F8F8A}
.fb-area:focus{outline:none;background:#fff;box-shadow:0 0 0 3px rgba(13,148,136,.22)}
.fb-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.fb-count{font-size:13px;color:var(--steel)}
.fb-btn{appearance:none;background:var(--accent);border:1px solid var(--accent);color:#fff;font:inherit;font-weight:600;font-size:15px;padding:11px 22px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.fb-btn .ic{width:17px;height:17px}
.fb-btn:hover{background:var(--accent-700);border-color:var(--accent-700)}
.fb-btn:disabled{opacity:.45;cursor:not-allowed}
.fb-err{color:var(--stop);font-size:13.5px;margin-top:10px;min-height:0}
.fb-err:empty{display:none}
.fb-done{text-align:center;padding:24px 10px 14px}
.fb-done-ic{width:56px;height:56px;border-radius:50%;background:var(--accent-tint);color:var(--accent-700);display:inline-grid;place-items:center}
.fb-done-ic .ic{width:26px;height:26px}
.fb-done h4{font-size:21px;margin:14px 0 4px}
.fb-done p{margin:0 0 18px;color:var(--muted)}
.fb-again{appearance:none;background:none;border:1.5px solid var(--accent);color:var(--accent-700);font:inherit;font-weight:600;font-size:14px;padding:9px 18px;border-radius:10px;cursor:pointer}
.fb-again:hover{background:var(--accent-tint)}
@media (max-width:900px){.ac-head,.ac-vh-top{grid-template-columns:1fr}}
@media (max-width:560px){.ac-grow{grid-template-columns:1fr}.ac-arrow{transform:rotate(90deg)}.ac-org .ac-arrow{width:100%}.ac-row{grid-template-columns:96px 12px minmax(0,1fr)}.ac-tl{padding:6px 14px}.ac-row.vh{margin:0 -14px;padding:11px 14px}.fb-card{padding:18px}}
@media (min-width:901px){.tabs a{padding:10px 12px 11px;font-size:13.5px}}

/* ---------- Discount authority ---------- */
.da{margin-top:18px;background:#fff;border:1.5px solid #F2C27A;border-radius:var(--radius-lg);overflow:hidden}
.da-head{background:#D97706;color:#fff;padding:13px 18px;display:flex;align-items:center;gap:10px}
.da-head h4{margin:0;font-size:16px;color:#fff}
.da-head .ic{color:#fff}
.da-body{padding:18px;display:grid;gap:16px}
.da-warn{background:#FEF6E7;border-left:3px solid #D97706;border-radius:var(--radius);padding:12px 14px;display:flex;gap:10px;font-size:14px;color:#78350F}
.da-warn .ic{color:#D97706;margin-top:2px}
.da-lbl{font-size:12.5px;font-weight:700;color:var(--steel);margin:0 0 9px}
.da-ladder{display:grid;grid-template-columns:minmax(0,1.25fr) 22px minmax(0,1fr) 22px minmax(0,1fr) 22px minmax(0,1.1fr);gap:5px;align-items:stretch}
.da-tier{border:1px solid var(--line);border-radius:var(--radius);padding:12px 13px;background:#fff}
.da-tier.first{border:1.5px solid #D97706;background:#FFFBF3}
.da-who{font-size:12px;font-weight:700;color:var(--steel);letter-spacing:.02em}
.da-pct{font-family:"Space Grotesk","Inter",sans-serif;font-weight:700;font-size:24px;line-height:1.2;margin:2px 0 4px;color:var(--ink)}
.da-sub{font-size:12.5px;color:var(--steel)}
.da-nm{display:block;font-size:13.5px;font-weight:700;color:var(--ink)}
.da-tt{display:block;font-size:12.5px;color:var(--steel);margin-bottom:5px}
.da-rule{margin-top:9px;display:grid;gap:6px}
.da-rule div{font-size:13px;background:#FEF6E7;border:1px solid #F6D9A8;border-radius:6px;padding:5px 9px;color:#78350F}
.da-rule strong{color:#92400E}
.da-arw{display:flex;align-items:center;justify-content:center;color:#D97706}
.da-crit{border:1.5px solid #F3B4AE;border-radius:var(--radius);overflow:hidden}
.da-crit-h{background:var(--stop-tint);color:var(--stop);font-weight:700;font-size:14px;padding:10px 14px;display:flex;gap:8px;align-items:center}
.da-crit ol{margin:0;padding:12px 16px 14px 36px;display:grid;gap:9px;font-size:14px}
.da-crit li::marker{color:var(--stop);font-weight:700}
/* ---------- Quebec legal reference ---------- */
.ql{border:1.5px solid var(--line-strong);border-radius:var(--radius);overflow:hidden}
.ql-head{background:#F1F4F9;padding:10px 14px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.ql-head .ic{color:var(--muted)}
.ql-internal{display:flex;gap:10px;align-items:flex-start;background:var(--navy);color:#fff;padding:11px 14px;font-size:14px}
.ql-internal .ic{color:#FBBF24;margin-top:2px}
.ql-internal strong{color:#FBBF24}
.ql-body{padding:14px;display:grid;gap:12px}
.ql-cite{display:grid;grid-template-columns:auto minmax(0,1fr);gap:11px;font-size:13.5px}
.ql-sec{font-family:"Space Grotesk","Inter",sans-serif;font-weight:700;color:var(--primary-700);background:var(--primary-tint);border:1px solid var(--primary-tint-2);border-radius:6px;padding:2px 9px;white-space:nowrap;height:fit-content}
.ql-cite strong{display:block;font-size:14px;margin-bottom:1px}
.ql-q{display:block;color:var(--muted)}
.ql-so{display:block;margin-top:3px;color:var(--accent-700);font-weight:600;font-size:13px}
.ql-rule{background:var(--accent-tint);border:1.5px solid var(--accent);border-radius:var(--radius);padding:11px 13px;font-size:14px;display:flex;gap:9px}
.ql-rule .ic{color:var(--accent-700);margin-top:2px}
.ql-src{font-size:12.5px;color:var(--steel);border-top:1px dashed var(--line-strong);padding-top:10px}
@media (max-width:900px){.da-ladder{grid-template-columns:1fr}.da-arw{transform:rotate(90deg);height:20px}}

<script>
window.initSite = function(){
  const PAGES = [...document.querySelectorAll('.page')].map(p => p.id);
  const toast = document.querySelector('.toast');
  let toastTimer;
  function showToast(msg){
    toast.textContent = msg; toast.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove('show'), 1600);
  }

  /* ---------- Clipboard ---------- */
  async function copyText(t){
    try { await navigator.clipboard.writeText(t); return true; }
    catch(e){
      const ta = document.createElement('textarea');
      ta.value = t; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      let ok = false; try { ok = document.execCommand('copy'); } catch(_){}
      ta.remove(); return ok;
    }
  }
  const icon = id => `<svg class="ic" aria-hidden="true"><use href="#${id}"/></svg>`;

  document.querySelectorAll('.chip').forEach(c => {
    if(!c.dataset.copy) c.dataset.copy = c.textContent.trim();
    c.innerHTML = icon('i-copy') + '<span>' + c.innerHTML + '</span>';
    c.title = 'Copy ' + c.dataset.copy;
  });

  document.addEventListener('click', async e => {
    const b = e.target.closest('.chip, [data-copy], [data-copy-from]');
    if(!b) return;
    e.preventDefault(); e.stopPropagation();
    let text = b.dataset.copy;
    if(b.dataset.copyFrom){
      const host = b.closest('details, .panel, .tpl');
      const pre = host && host.querySelector('pre');
      text = pre ? pre.textContent : '';
    }
    if(!text) return;
    const ok = await copyText(text);
    const short = text.length > 46 ? 'Copied ' + (b.closest('details')?.querySelector('.tpl-title strong')?.textContent || 'text') : 'Copied ' + text;
    showToast(ok ? short : 'Copy blocked by the browser. Select and copy manually.');
    if(ok){
      b.classList.add('done');
      const use = b.querySelector('use'); if(use) use.setAttribute('href','#i-check');
      setTimeout(() => { b.classList.remove('done'); if(use) use.setAttribute('href','#i-copy'); }, 1300);
    }
  }, true);

  /* ---------- Placeholder highlight in templates ---------- */
  const esc = s => s.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
  document.querySelectorAll('pre.text').forEach(p => {
    p.innerHTML = esc(p.textContent).replace(/\[[^\]\n]+\]|_{6,}|\$xx|last xx|\(account number\)/g, m => `<span class="ph">${m}</span>`);
  });

  /* ---------- Download links ---------- */
  document.querySelectorAll('a.file').forEach(a => {
    const name = a.dataset.file;
    if(a.dataset.url){
      a.href = a.dataset.url; a.target = '_blank'; a.rel = 'noopener';
    } else {
      const fext = name.split('.').pop().toLowerCase();
      const fileUrl = new URL(encodeURIComponent(name), location.href).href;
      a.href = (fext === 'doc' || fext === 'docx') ? 'https://docs.google.com/viewer?url=' + encodeURIComponent(fileUrl) : encodeURIComponent(name);
      a.target = '_blank'; a.rel = 'noopener';
    }
    const ext = name.split('.').pop().toLowerCase();
    const extEl = a.querySelector('.ext'); extEl.textContent = ext.toUpperCase(); extEl.classList.add(ext);
    a.title = 'Open ' + name + (a.dataset.url ? '' : ' in a new tab');
  });

  /* ---------- Routing ---------- */
  const tabs = [...document.querySelectorAll('.tabs a')];
  function route(){
    const raw = decodeURIComponent(location.hash.slice(1));
    let [page, anchor] = raw.split(':');
    if(!PAGES.includes(page)) page = 'home';
    document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === page));
    tabs.forEach(t => t.getAttribute('href') === '#' + page ? t.setAttribute('aria-current','page') : t.removeAttribute('aria-current'));
    const active = tabs.find(t => t.hasAttribute('aria-current'));
    if(active) active.scrollIntoView({block:'nearest', inline:'nearest'});
    document.title = (document.getElementById(page).dataset.name) + ' · Team Mitch';
    closeAllResults();
    if(anchor) reveal(anchor); else window.scrollTo(0,0);
  }
  function reveal(id){
    const el = document.getElementById(id);
    if(!el) return;
    const d = el.matches('details') ? el : el.closest('details');
    if(d) d.open = true;
    requestAnimationFrame(() => {
      el.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'start'});
      el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
    });
  }
  window.addEventListener('hashchange', route);

  /* ---------- Search ---------- */
  let n = 0;
  const norm = s => s.toLowerCase().replace(/\s+/g,' ').trim();
  const INDEX = [...document.querySelectorAll('[data-s]')].map(el => {
    if(!el.id) el.id = 'item-' + (++n);
    const page = el.closest('.page');
    const parts = []; const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    while(w.nextNode()) parts.push(w.currentNode.nodeValue);
    const raw = parts.join(' ').replace(/\s+/g,' ').trim();
    return { el, id: el.id, page: page.id, pageName: page.dataset.name, title: el.dataset.s, raw, hay: norm(el.dataset.s + ' ' + raw + ' ' + (el.dataset.file || '')) };
  });

  function search(q){
    const terms = norm(q).split(' ').filter(Boolean);
    if(!terms.length) return [];
    const digits = q.replace(/\D/g,'');
    return INDEX.map(it => {
      let ok = terms.every(t => it.hay.includes(t));
      if(!ok && digits.length >= 3 && it.hay.replace(/\D/g,'').includes(digits)) ok = true;
      if(!ok) return null;
      const t = norm(it.title);
      let score = terms.reduce((s,x) => s + (t.includes(x) ? 5 : 1), 0);
      if(t.startsWith(terms[0])) score += 3;
      score -= it.raw.length / 4000;
      return {...it, score};
    }).filter(Boolean).filter((r,_,all) => !all.some(o => o !== r && r.el.contains(o.el)))
      .sort((a,b) => b.score - a.score).slice(0, 10);
  }
  function snippet(raw, q){
    const terms = norm(q).split(' ').filter(Boolean);
    const low = raw.toLowerCase();
    let at = -1; for(const t of terms){ at = low.indexOf(t); if(at > -1) break; }
    let s = at > 50 ? '…' + raw.slice(at - 40, at + 120) : raw.slice(0, 160);
    s = esc(s);
    terms.forEach(t => { if(t.length > 1) s = s.replace(new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')','gi'), '<mark>$1</mark>'); });
    return s;
  }

  const boxes = [];
  document.querySelectorAll('[data-searchbox]').forEach(holder => {
    const ph = holder.dataset.placeholder || 'Search the whole site…';
    holder.innerHTML = `<div class="search" role="search">${icon('i-search')}<label class="sr-only">Search</label><input type="search" placeholder="${ph}" autocomplete="off" spellcheck="false" aria-label="Search"><kbd>/</kbd><ul class="results" role="listbox"></ul></div>`;
    const input = holder.querySelector('input'), list = holder.querySelector('.results'), kbd = holder.querySelector('kbd');
    let sel = -1;
    const render = () => {
      const q = input.value; kbd.style.display = q ? 'none' : '';
      if(!q.trim()){ list.classList.remove('open'); list.innerHTML=''; return; }
      const res = search(q); sel = res.length ? 0 : -1;
      list.innerHTML = res.length ? res.map((r,i) => `<li><a href="#${r.page}:${r.id}" class="${i===0?'sel':''}"><div class="r-top"><span class="r-title">${esc(r.title)}</span><span class="r-page">${esc(r.pageName)}</span></div><div class="r-snip">${snippet(r.raw, q)}</div></a></li>`).join('')
        : `<li class="empty">No matches for “${esc(q)}”. Try a name, department, extension or file name.</li>`;
      list.classList.add('open');
    };
    input.addEventListener('input', render);
    input.addEventListener('focus', () => { if(input.value.trim()) render(); });
    input.addEventListener('keydown', e => {
      const links = [...list.querySelectorAll('a')];
      if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
        if(!links.length) return; e.preventDefault();
        sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + links.length) % links.length;
        links.forEach((l,i) => l.classList.toggle('sel', i === sel)); links[sel].scrollIntoView({block:'nearest'});
      } else if(e.key === 'Enter' && links[sel]){ e.preventDefault(); go(links[sel].getAttribute('href')); }
      else if(e.key === 'Escape'){ input.value=''; render(); input.blur(); }
    });
    list.addEventListener('click', e => { const a = e.target.closest('a'); if(a){ e.preventDefault(); go(a.getAttribute('href')); } });
    boxes.push({input, list});
  });
  function go(href){
    boxes.forEach(b => { b.input.value=''; b.input.dispatchEvent(new Event('input')); b.input.blur(); });
    if(location.hash === href) route(); else location.hash = href;
  }
  function closeAllResults(){ boxes.forEach(b => b.list.classList.remove('open')); }
  document.addEventListener('click', e => { if(!e.target.closest('.search')) closeAllResults(); });
  document.addEventListener('keydown', e => {
    if(e.key === '/' && !/input|textarea/i.test(document.activeElement.tagName)){
      const box = document.querySelector('.page.active .search input');
      if(box){ e.preventDefault(); box.focus(); }
    }
  });

  /* in-page anchor links like #templates:t-term-in */
  document.addEventListener('click', e => {
    const a = e.target.closest('a[href^="#"]');
    if(a && !a.closest('.results') && a.getAttribute('href') === location.hash){ e.preventDefault(); route(); }
  });

  route();
};
window.initFeedback = function(){
  var form = document.getElementById('fb-form');
  if (!form) return;
  var msg = document.getElementById('fb-msg'), send = document.getElementById('fb-send'),
      count = document.getElementById('fb-count'), err = document.getElementById('fb-err'),
      done = document.getElementById('fb-done'), again = document.getElementById('fb-again');
  var label = send.querySelector('span'), last = 0;
  function update(){ count.textContent = msg.value.length + ' / 2000'; send.disabled = !msg.value.trim(); err.textContent = ''; }
  msg.addEventListener('input', update);
  send.addEventListener('click', function(){
    var text = msg.value.trim();
    if (!text) return;
    var url = window.TM_FEEDBACK_URL || '';
    if (!/^https:\/\/script\.google\.com\//.test(url)) { err.textContent = 'Feedback isn\u2019t connected yet. Please message the Site Admin.'; return; }
    if (Date.now() - last < 30000) { err.textContent = 'Please wait a few seconds before sending another message.'; return; }
    var user = window.TM_USER || {};
    send.disabled = true; label.textContent = 'Sending\u2026';
    fetch(url, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ name: user.name || '', ext: user.ext || '', message: text }) })
    .then(function(){
      last = Date.now();
      form.hidden = true; done.hidden = false;
      msg.value = ''; update();
    })
    .catch(function(){ err.textContent = 'Your message couldn\u2019t be sent. Check your connection and try again.'; send.disabled = false; })
    .then(function(){ label.textContent = 'Submit feedback'; });
  });
  again.addEventListener('click', function(){ done.hidden = true; form.hidden = false; msg.focus(); });
};

</script>
<script>
(function(){
  var V = JSON.parse(document.getElementById('vault').textContent);
  var LOCK_KEY = 'tm_lock', SESSION_KEY = 'tm_session', DAY = 864e5;
  var NOT_LISTED = 'That extension isn\u2019t on the list. Try again.';
  var STEPS = {
    3: { min: 3,    msg: NOT_LISTED },
    4: { min: 9,    msg: 'Having trouble? Please contact Mitch Gutierrez or the Site Admin' },
    5: { min: 15,   msg: 'Last entry before lockout. Please contact Mitch Gutierrez or the Site Admin' },
    6: { min: 1440, msg: 'You\u2019re locked out. Try again tomorrow' }
  };
  var WARN_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10.3 3.9-8.2 14A2 2 0 0 0 3.8 21h16.4a2 2 0 0 0 1.7-3.1l-8.2-14a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>';
  var CLOCK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
  var LOCK_ICON = document.getElementById('gate-ic').innerHTML;
  var CHECK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';

  var $ = function(id){ return document.getElementById(id); };
  var input = $('gate-code'), btn = $('gate-go'), msg = $('gate-msg'), card = $('gate-card');
  var clock = $('gate-clock'), time = $('gate-time'), icon = $('gate-ic'), title = $('gate-h'), sub = $('gate-p');
  var enc = new TextEncoder(), dec = new TextDecoder();
  var ub = function(s){ return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0); }); };
  var fresh = function(){ return { w: 0, u: 0, t: 0 }; };

  function readLock(){ try { return JSON.parse(localStorage.getItem(LOCK_KEY)) || fresh(); } catch(e){ return fresh(); } }
  function saveLock(){ try { localStorage.setItem(LOCK_KEY, JSON.stringify(st)); } catch(e){} }
  var st = readLock(), timer = null, busy = false;

  function normalize(){
    var now = Date.now();
    if (st.u && now >= st.u && st.w >= 6) { st = fresh(); saveLock(); }
    else if ((!st.u || now >= st.u) && st.t && now - st.t > DAY) { st = fresh(); saveLock(); }
  }
  function fmt(ms){
    var s = Math.ceil(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
    var pad = function(n){ return String(n).padStart(2, '0'); };
    return h ? h + ':' + pad(m) + ':' + pad(x) : m + ':' + pad(x);
  }
  function showMsg(text, warn){
    msg.className = 'gate-msg' + (warn ? ' warn' : '');
    msg.innerHTML = '';
    if (!text) return;
    if (warn) msg.insertAdjacentHTML('beforeend', WARN_ICON);
    var span = document.createElement('span'); span.textContent = text; msg.appendChild(span);
  }
  function setLocked(on){
    input.disabled = on; btn.disabled = on; clock.hidden = !on;
    card.classList.toggle('is-locked', on);
    icon.innerHTML = on ? CLOCK_ICON : LOCK_ICON;
    title.textContent = on ? 'Please wait' : 'Staff only';
    sub.textContent = on ? 'Entry is paused after too many wrong extensions.' : 'Enter your 4-digit extension to open the team resources.';
  }
  function renderLock(){
    var left = st.u - Date.now();
    if (st.u && left > 0) {
      setLocked(true);
      showMsg(STEPS[Math.min(st.w, 6)].msg, true);
      time.textContent = fmt(left);
      if (!timer) timer = setInterval(renderLock, 1000);
      return true;
    }
    if (timer) { clearInterval(timer); timer = null; }
    var wasLocked = card.classList.contains('is-locked');
    if (st.w >= 6) { st = fresh(); saveLock(); }
    else if (st.u) { st.u = 0; saveLock(); }
    setLocked(false);
    if (wasLocked) { showMsg(''); input.focus(); }
    return false;
  }

  function tryCode(code){
    return crypto.subtle.importKey('raw', enc.encode(code), 'PBKDF2', false, ['deriveKey']).then(function(base){
      return Promise.allSettled(V.b.map(function(b){
        return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: ub(b.s), iterations: V.it, hash: 'SHA-256' },
          base, { name: 'AES-GCM', length: 256 }, false, ['decrypt'])
          .then(function(kek){ return crypto.subtle.decrypt({ name: 'AES-GCM', iv: ub(b.i) }, kek, ub(b.c)); })
          .then(function(pt){ return JSON.parse(dec.decode(pt)); });
      }));
    }).then(function(res){
      for (var i = 0; i < res.length; i++) if (res[i].status === 'fulfilled') return res[i].value;
      return null;
    });
  }

  function openSite(sess){
    window.TM_USER = { name: sess.n || '', ext: sess.x || '' };
    return crypto.subtle.importKey('raw', ub(sess.k), 'AES-GCM', false, ['decrypt'])
      .then(function(key){ return crypto.subtle.decrypt({ name: 'AES-GCM', iv: ub(V.iv) }, key, ub(V.ct)); })
      .then(function(pt){
        var site = $('site');
        site.innerHTML = dec.decode(pt);
        $('gate').remove();
        site.hidden = false;
        document.body.classList.remove('locked');
        window.initSite();
        if (window.initFeedback) window.initFeedback();
        var out = $('tm-signout');
        if (out) out.addEventListener('click', function(){
          try { sessionStorage.removeItem(SESSION_KEY); } catch(e){}
          location.replace(location.pathname);
        });
      });
  }

  function welcome(name){
    card.classList.remove('is-locked');
    icon.innerHTML = CHECK_ICON;
    title.textContent = 'Welcome, ' + name;
    sub.textContent = '';
    sub.insertAdjacentHTML('beforeend', '<span class="gate-ok">Opening Team Mitch\u2026</span>');
    $('gate-form').hidden = true; clock.hidden = true; showMsg('');
  }

  function failOpen(){
    try { sessionStorage.removeItem(SESSION_KEY); } catch(e){}
    location.replace(location.pathname);
  }

  input.addEventListener('input', function(){
    input.value = input.value.replace(/\D/g, '').slice(0, 4);
    if (!card.classList.contains('is-locked') && !msg.classList.contains('warn')) showMsg('');
  });

  $('gate-form').addEventListener('submit', function(e){
    e.preventDefault();
    if (busy) return;
    normalize();
    if (renderLock()) return;
    var v = input.value;
    if (v.length !== 4) { showMsg('Enter all 4 digits of your extension.', false); input.focus(); return; }
    busy = true; btn.disabled = true; btn.textContent = 'Checking\u2026';
    tryCode(v).catch(function(){ return null; }).then(function(hit){
      busy = false; btn.disabled = false; btn.textContent = 'Enter site';
      input.value = '';
      if (hit) {
        st = fresh(); saveLock();
        hit.x = v;
        try { sessionStorage.setItem(SESSION_KEY, JSON.stringify(hit)); } catch(e){}
        welcome(hit.n);
        setTimeout(function(){ openSite(hit).catch(failOpen); }, 1500);
        return;
      }
      st.w += 1; st.t = Date.now();
      var step = STEPS[Math.min(st.w, 6)];
      if (step) { st.u = Date.now() + step.min * 60000; saveLock(); renderLock(); }
      else { saveLock(); showMsg(NOT_LISTED, false); input.focus(); }
    });
  });

  if (!window.crypto || !crypto.subtle) {
    setLocked(true); clock.hidden = true;
    showMsg('This browser can\u2019t open the site. Use an up-to-date Chrome, Edge, Safari or Firefox.', true);
    return;
  }

  var saved = null;
  try { saved = JSON.parse(sessionStorage.getItem(SESSION_KEY)); } catch(e){}
  if (saved && saved.k) { openSite(saved).catch(failOpen); return; }

  normalize();
  if (!renderLock()) input.focus();
})();

</script>
</body>
